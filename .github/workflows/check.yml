name: Fieldwork checks
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - name: Start isolated real Supabase Auth test stack
        run: |
          mkdir -p private
          FIELDWORK_KEEP_TEST_STACK=1 npm run test:auth > private/auth-ci.log 2>&1 &
          echo $! > private/auth-ci.pid
          for step in $(seq 1 120); do
            if test -f private/auth-report.json; then exit 0; fi
            if ! kill -0 "$(cat private/auth-ci.pid)" 2>/dev/null; then echo 'Auth test stack failed; credentials are withheld from logs.'; exit 1; fi
            sleep 1
          done
          echo 'Auth test stack timed out.'
          exit 1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start > private/start-ci.log 2>&1 &
          echo $! > private/start-ci.pid
      - name: Real API and browser checks
        run: npm run test:api && PLAYWRIGHT_EXECUTABLE_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)" PLAYWRIGHT_PRODUCTION=1 npm run test:browser
      - name: Stop this job's test stack
        if: always()
        run: |
          test ! -f private/start-ci.pid || kill "$(cat private/start-ci.pid)" || true
          test ! -f private/auth-ci.pid || kill "$(cat private/auth-ci.pid)" || true
