name: Fieldwork checks
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          mkdir -p private
          npm run start > private/start-ci.log 2>&1 &
          echo $! > private/start-ci.pid
          for step in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            if ! kill -0 "$(cat private/start-ci.pid)" 2>/dev/null; then echo 'Test server failed to start.'; exit 1; fi
            sleep 1
          done
          echo 'Test server readiness timed out.'
          exit 1
      - name: Standalone browser checks
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 PLAYWRIGHT_EXTERNAL_SERVER=1 PLAYWRIGHT_PRODUCTION=1 npm run test:browser
      - name: Stop this job's test server
        if: always()
        run: |
          test ! -f private/start-ci.pid || kill "$(cat private/start-ci.pid)" || true
