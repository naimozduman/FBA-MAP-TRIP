# Isolated local tests only. Remote project configuration is separate.
project_id = "fieldwork-v2-local"
[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.pooler]
enabled = false
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = false
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true
[edge_runtime]
enabled = false
[analytics]
enabled = false
